<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Ishmael Kiplangat">
  <meta name="description" content="Login to Cryptic Signal by Ishmael Kiplangat. Secure access to AI lessons and tutorials.">
  <title>Login | Cryptic Signal</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <nav>
      <h1 class="logo">CRYPTIC SIGNAL</h1>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="lesson.html">Lessons</a></li>
        <li><a href="/login">Login</a></li>
        <li><a href="#">AI Tools</a></li>
      </ul>
    </nav>
  </header>

  <section class="auth-page">
    <div class="auth-box">
      <h2>Login to Cryptic Signal</h2>
      <p class="auth-subtitle">Enter your credentials to continue.</p>
      <form action="/login" method="post">
        <input type="text" name="Email Address" placeholder="Email Address"
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
      <p id="error-msg" class="auth-error"></p>
    </div>
  </section>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error')) {
      document.getElementById('error-msg').innerText = 'Invalid username or password.';
    }
  </script>
</body>
</html>
